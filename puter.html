<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Puter API тест (через puter.ai.chat)</title>
<script src="https://js.puter.com/v2/"></script>
<style>
body { font-family: system-ui, sans-serif; background:#f6f7fb; padding:20px; color:#111; }
button { padding:10px 16px; border-radius:8px; border:0; background:#2463ff; color:#fff; cursor:pointer; }
pre { background:#fff; padding:12px; border-radius:8px; margin-top:16px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
  <h2>🧠 Проверка Puter API (через puter.ai.chat)</h2>
  <p>Нажми кнопку, чтобы отправить тестовый запрос к <code>puter.ai.chat()</code> без ключей.</p>
  <button id="run">Запустить тест</button>
  <pre id="output">—</pre>

<script>
document.getElementById('run').addEventListener('click', async () => {
  const out = document.getElementById('output');
  out.textContent = '⏳ Отправляю запрос к Puter...';

  if (typeof puter === 'undefined' || !puter.ai || !puter.ai.chat) {
    out.textContent = '❌ puter.ai.chat() не найден. Возможно, библиотека не загрузилась.';
    return;
  }

  try {
    const prompt = "Скажи кратко: работает ли Puter API?";
    const res = await puter.ai.chat(prompt, false, { model: 'gpt-5-nano', max_tokens: 100 });
    console.log('Raw response:', res);

    // пробуем получить текст ответа
    const text = res?.text || res?.output?.[0]?.content?.[0]?.text ||
                 res?.choices?.[0]?.message?.content || JSON.stringify(res);
    out.textContent = '✅ Ответ от Puter:\n\n' + text;
  } catch (err) {
    console.error(err);
    out.textContent = '❌ Ошибка запроса:\n' + err;
  }
});
</script>
</body>
</html>
